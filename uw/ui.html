<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exparsed Underwriting</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #fff;
        --text: #1d1d1b;
        --muted: #6b6b66;
        --border: #dcdcd6;
        --accent: #2457c5;
        --neg: #b3261e;
        --ok: #1e7a3c;
        --code: #f0f0ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --panel: #1f1f1d;
          --text: #e8e8e3;
          --muted: #9a9a93;
          --border: #34342f;
          --accent: #7aa2f7;
          --neg: #f2867d;
          --ok: #6fcf8f;
          --code: #2a2a27;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: baseline;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .neg {
        color: var(--neg);
      }
      .ok {
        color: var(--ok);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 16px;
        padding: 16px;
        align-items: start;
      }
      @media (max-width: 1000px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        min-width: 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      select,
      input,
      textarea,
      button {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
      }
      select {
        max-width: 100%;
      }
      input {
        min-width: 180px;
        flex: 1;
      }
      button {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #report {
        overflow-x: auto;
      }
      #report h3 {
        font-size: 14px;
        margin: 18px 0 6px;
      }
      table {
        border-collapse: collapse;
        font-size: 12.5px;
        margin: 4px 0 10px;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 4px 6px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--code);
      }
      code {
        background: var(--code);
        padding: 0 3px;
        border-radius: 3px;
        font-size: 12px;
      }
      #chat {
        position: sticky;
        top: 16px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 32px);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 8px 0;
        min-height: 120px;
      }
      .msg {
        padding: 8px 10px;
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.user {
        background: var(--code);
        align-self: flex-end;
        max-width: 90%;
      }
      .msg.assistant {
        border: 1px solid var(--border);
      }
      .msg.error {
        color: var(--neg);
        border: 1px solid var(--neg);
      }
      #ask {
        display: flex;
        gap: 8px;
      }
      #ask textarea {
        flex: 1;
        resize: vertical;
        min-height: 60px;
      }
      .status {
        min-height: 1.4em;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Exparsed Underwriting</h1>
      <span id="runInfo" class="muted">Loading…</span>
      <span id="headline"></span>
    </header>
    <main>
      <section>
        <div class="controls">
          <select id="model" aria-label="Model">
            <option>Loading models…</option>
          </select>
          <button id="judge" type="button">Run judgments</button>
        </div>
        <div class="controls">
          <input
            id="owners"
            placeholder="Owner names, comma separated"
            aria-label="Owner names"
          />
          <input
            id="business"
            placeholder="Business name"
            aria-label="Business name"
          />
        </div>
        <div id="status" class="status muted"></div>
        <div id="report"></div>
      </section>
      <section id="chat">
        <strong>Ask about this run</strong>
        <span class="muted" id="ctx"></span>
        <div id="log"></div>
        <div id="ask">
          <textarea
            id="q"
            placeholder="e.g. Which debits make up the RapidFund position?"
            aria-label="Question"
          ></textarea>
          <button id="send" type="button">Send</button>
        </div>
      </section>
    </main>
    <script>
      (function () {
        "use strict";
        var $ = function (id) {
          return document.getElementById(id);
        };
        var runId = new URLSearchParams(location.search).get("run");
        var history = []; // this run's chat; gone when the tab closes

        function esc(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }
        function inline(s) {
          return esc(s)
            .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
            .replace(/`([^`]+)`/g, "<code>$1</code>");
        }
        // The engine's report uses headings, pipe tables, bold and plain lines only.
        function markdown(md) {
          var out = [],
            lines = md.split("\n"),
            i = 0;
          while (i < lines.length) {
            var l = lines[i];
            if (/^\s*\|/.test(l)) {
              var rows = [];
              while (i < lines.length && /^\s*\|/.test(lines[i]))
                rows.push(lines[i++]);
              var cells = function (r) {
                return r
                  .trim()
                  .replace(/^\||\|$/g, "")
                  .split("|");
              };
              var body = rows.filter(function (r, k) {
                return k !== 1 || !/^[\s|:\-]+$/.test(r);
              });
              out.push(
                "<table><thead><tr>" +
                  cells(body[0])
                    .map(function (c) {
                      return "<th>" + inline(c.trim()) + "</th>";
                    })
                    .join("") +
                  "</tr></thead><tbody>" +
                  body
                    .slice(1)
                    .map(function (r) {
                      return (
                        "<tr>" +
                        cells(r)
                          .map(function (c) {
                            return "<td>" + inline(c.trim()) + "</td>";
                          })
                          .join("") +
                        "</tr>"
                      );
                    })
                    .join("") +
                  "</tbody></table>",
              );
              continue;
            }
            var h = /^(#{1,6})\s+(.*)$/.exec(l);
            if (h) out.push("<h3>" + inline(h[2]) + "</h3>");
            else if (l.trim()) out.push("<p>" + inline(l) + "</p>");
            i++;
          }
          return out.join("\n");
        }
        function api(method, path, body) {
          return fetch(path, {
            method: method,
            headers: body ? { "Content-Type": "application/json" } : {},
            body: body ? JSON.stringify(body) : undefined,
          }).then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
              return j;
            });
          });
        }
        function status(text, cls) {
          $("status").className = "status " + (cls || "muted");
          $("status").textContent = text;
        }
        function show(s) {
          $("runInfo").textContent =
            s.files +
            " file(s), " +
            s.transactions +
            " transactions" +
            (s.skipped.length
              ? " · skipped: " +
                s.skipped
                  .map(function (x) {
                    return x.file + " (" + x.reason + ")";
                  })
                  .join(", ")
              : "");
          $("headline").innerHTML =
            "HEADLINE <b>" +
            esc(s.headline) +
            "</b>/mo · " +
            (s.open_questions
              ? '<span class="neg">' +
                s.open_questions +
                " question(s) open, engine defaults applied</span>"
              : '<span class="ok">all questions answered</span>') +
            (s.judged_by
              ? " · judged by " + esc(s.judged_by)
              : " · no judgments yet");
          $("ctx").textContent =
            "Chat context about " +
            s.context_tokens.toLocaleString() +
            " tokens (ledger, report, audit, judgments).";
          $("owners").value = (s.owners || []).join(", ");
          $("business").value = s.business || "";
          $("report").innerHTML = markdown(s.report);
        }
        function busy(on) {
          $("judge").disabled = $("send").disabled = on;
        }

        if (!runId) {
          $("runInfo").textContent = "No run. Press Underwrite in Exparsed.";
          busy(true);
          return;
        }
        api("GET", "/runs/" + runId)
          .then(show)
          .catch(function (e) {
            $("runInfo").textContent = e.message;
            busy(true);
          });
        api("GET", "/models")
          .then(function (m) {
            var sel = $("model"),
              saved = null;
            try {
              saved = localStorage.getItem("uw.model");
            } catch (e) {}
            sel.innerHTML =
              m.models
                .map(function (x) {
                  return (
                    '<option value="' +
                    esc(x.id) +
                    '">' +
                    esc(x.provider + " · " + x.model) +
                    "</option>"
                  );
                })
                .join("") ||
              '<option value="">No models: set an API key or start a local model server</option>';
            if (
              saved &&
              m.models.some(function (x) {
                return x.id === saved;
              })
            )
              sel.value = saved;
            var errs = Object.keys(m.errors);
            if (errs.length)
              status(
                "Model list failed for " +
                  errs
                    .map(function (k) {
                      return k + ": " + m.errors[k];
                    })
                    .join("; "),
                "neg",
              );
          })
          .catch(function (e) {
            status("Model list failed: " + e.message, "neg");
          });
        $("model").addEventListener("change", function () {
          try {
            localStorage.setItem("uw.model", this.value);
          } catch (e) {}
        });

        $("judge").addEventListener("click", function () {
          var model = $("model").value;
          if (!model) return;
          busy(true);
          status("Asking " + model + " the engine's questions…");
          api("POST", "/runs/" + runId + "/judge", {
            model: model,
            owners: $("owners").value.split(","),
            business: $("business").value,
          })
            .then(function (s) {
              show(s);
              status("Judgments accepted by the engine.", "ok");
            })
            .catch(function (e) {
              status(e.message, "neg");
            })
            .then(function () {
              busy(false);
            });
        });
        function add(role, text) {
          var d = document.createElement("div");
          d.className = "msg " + role;
          d.textContent = text;
          $("log").appendChild(d);
          $("log").scrollTop = $("log").scrollHeight;
        }
        function send() {
          var q = $("q").value.trim(),
            model = $("model").value;
          if (!q || !model) return;
          history.push({ role: "user", content: q });
          add("user", q);
          $("q").value = "";
          busy(true);
          api("POST", "/runs/" + runId + "/chat", {
            model: model,
            messages: history,
          })
            .then(function (r) {
              history.push({ role: "assistant", content: r.reply });
              add("assistant", r.reply);
            })
            .catch(function (e) {
              history.pop();
              add("error", e.message);
            })
            .then(function () {
              busy(false);
            });
        }
        $("send").addEventListener("click", send);
        $("q").addEventListener("keydown", function (e) {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
        });
      })();
    </script>
  </body>
</html>
